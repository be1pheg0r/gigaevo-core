# @package _global_
defaults:
  - common
  - _self_
#
# Live cost-monitor agent — CostMonitorAgent runs every `interval` accepted
# mutants (post_step_hook fires once per ingestor sweep that landed a
# program) and adjusts the live cost model's cold_start / golden_ratio /
# growth_rate. LLM telemetry is fed live via the in-process LLM_CALL
# subscriber in gigaevo/monitoring/emit.py — no log tailing.
#
# Adjustments are logged as COST_AGENT_ADJUSTMENT canonical events for
# offline analysis.
#
# Not part of the `pipeline` group on purpose: it's orthogonal to
# pipeline_builder choice. Enable additively on top of any experiment:
#
#   python run.py problem.name=heilbron +cost_monitor=enabled
#
# Composes AFTER the defaults list, so it wins the post_step_hook slot even
# when combined with pipeline=intra_extra_memory (LiveMemoryRefreshHook) —
# the two hooks are not currently combinable (single post_step_hook slot).

cost_monitor_agent:
  _target_: gigaevo.llm.agents.cost_monitor.CostMonitorAgent
  llm: ${ref:llm}
