# @package _global_

# "Летняя школа" GPU server, Qwen3.6-27B-Fable-Fusion (Heretic) variant —
# see AIRI Notion: "LLM-серверы — подключение". Same host as Qwen3.5-9B
# (82.202.157.243) but a distinct `/big` path and its own model instance:
# dense (all 27B params active every token), Q6_K, 32768 ctx, single
# instance spread across 4 GPUs — the slowest of the three (~26 tok/s) and
# the only one with safety alignment removed (ARA/Heretic v1.2). Kept as a
# separate single-model config rather than folded into
# `summer_school_servers.yaml`'s blend: pick it explicitly when mutation
# needs content the other two servers refuse to produce.
#
# Requires env var: SUMMER_SCHOOL_LLM_KEY_A=<key for 82.202.157.243>
# (shared with Qwen3.5-9B — same host).
#
# Usage:
#   python run.py ... llm=summer_school_27b

llm:
  _target_: gigaevo.llm.models.MultiModelRouter
  _convert_: all
  models:
    - _target_: langchain_openai.ChatOpenAI
      model: qwen3.6-27b-fable-fusion
      api_key: ${oc.env:SUMMER_SCHOOL_LLM_KEY_A}
      base_url: http://82.202.157.243:8080/big/v1
      temperature: 1.0
      max_tokens: 4096
      request_timeout: ${request_timeout}
      extra_body:
        top_p: 0.95
        top_k: 20
        chat_template_kwargs:
          enable_thinking: false
  probabilities: [1.0]
  writer: ${writer}
