# @package _global_

# Compute required behavior keys from islands
required_behavior_keys:
  _target_: gigaevo.config.helpers.extract_behavior_keys_from_islands
  island_configs: ${islands}

# Parent selector
parent_selector:
  _target_: gigaevo.evolution.mutation.parent_selector.AllCombinationsParentSelector
  num_parents: ${num_parents}

# Program acceptor
program_acceptor:
  _target_: gigaevo.evolution.engine.acceptor.StandardEvolutionAcceptor
  required_behavior_keys: ${required_behavior_keys}

# Engine config
engine_config:
  _target_: gigaevo.evolution.engine.SteadyStateEngineConfig
  loop_interval: ${loop_interval}
  max_elites_per_generation: ${max_elites_per_generation}
  program_acceptor: ${program_acceptor}
  parent_selector: ${parent_selector}
  stopper: ${stopper}
  max_in_flight: ${max_in_flight}

metrics_tracker:
  _target_: gigaevo.utils.metrics_tracker.MetricsTracker
  storage: ${ref:redis_storage}
  metrics_context: ${metrics_context}
  writer: ${ref:writer}

# Evolution engine
evolution_engine:
  _target_: gigaevo.evolution.engine.SteadyStateEvolutionEngine
  storage: ${ref:redis_storage}
  strategy: ${evolution_strategy}
  mutation_operator: ${mutation_operator}
  config: ${engine_config}
  # `${ref:x}` — NOT `${x}` — for every node that owns state or subscribes to
  # the global event bus. A plain interpolation of a `_target_` node makes
  # `instantiate(cfg, recursive=True)` build it twice: once as the top-level
  # node, once here. Measured on the 2026-07-31 ablations: two live
  # CostMonitorHooks, each flushing its own prediction and waking its own
  # agent (28% of wakeups were the twin), each with its own agent budget.
  writer: ${ref:writer}
  metrics_tracker: ${ref:metrics_tracker}
  pre_step_hook: ${ref:pre_step_hook}
  post_run_hook: ${ref:ideas_tracker}
  post_step_hook: ${ref:post_step_hook}
