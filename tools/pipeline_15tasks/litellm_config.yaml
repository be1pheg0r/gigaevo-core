# LiteLLM proxy config for the 15-task overnight experiment.
#
# Most problems' shared_config.py / config.py hardcode
# `client_kwargs.base_url = "http://localhost:8000/v1"` and
# `client_kwargs.api_key = "sk-gigaevo"` for their chain-eval / prompt-eval
# LLMClient (see problems/chains/*/shared_config.py, problems/prompts/*/config.py).
# Rather than editing every task's config to point at the AIRI summer-school
# servers, this proxy sits on localhost:8000 and forwards to those servers —
# every task works unmodified.
#
# Two deployments under the same wildcard model_name give litellm's proxy
# basic round-robin load balancing across both servers (see
# docs/... summer-school guide: 728 tok/s aggregate on 9B, 359 tok/s on
# 35B-A3B — blending roughly doubles available throughput over one server).
#
# Usage:
#   litellm --config tools/pipeline_15tasks/litellm_config.yaml --port 8000
#
# Requires env vars (same ones used by config/llm/summer_school_servers.yaml):
#   SUMMER_SCHOOL_LLM_KEY_A=<key for 82.202.157.243>
#   SUMMER_SCHOOL_LLM_KEY_B=<key for 82.202.156.206>

model_list:
  - model_name: "*"
    litellm_params:
      model: openai/qwen3.5-9b
      api_base: http://82.202.157.243:8080/v1
      api_key: os.environ/SUMMER_SCHOOL_LLM_KEY_A
  - model_name: "*"
    litellm_params:
      model: openai/qwen3.6-35b-a3b
      api_base: http://82.202.156.206:8080/v1
      api_key: os.environ/SUMMER_SCHOOL_LLM_KEY_B

general_settings:
  # Matches the "sk-gigaevo" default api_key hardcoded in most tasks'
  # client_kwargs, so no per-task config edits are needed.
  master_key: sk-gigaevo
